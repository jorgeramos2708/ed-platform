name: edp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edp
      POSTGRES_PASSWORD: edp_dev
      POSTGRES_DB: edp
    ports:
      - "5433:5432"
    volumes:
      - edp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edp -d edp"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/server
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      DATABASE_URL: postgres://edp:edp_dev@postgres:5432/edp
      JWT_SECRET: edp-dev-secret-no-produccion # solo desarrollo; el instalador (ADR-0011) generará uno real
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  edp-pgdata:
