name: edp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edp
      POSTGRES_PASSWORD: edp_dev
      POSTGRES_DB: edp
    ports:
      - "5433:5432"
    volumes:
      - edp-pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edp -d edp"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/server
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      DATABASE_URL: postgres://edp:edp_dev@postgres:5432/edp
      JWT_SECRET: edp-dev-secret-no-produccion # solo desarrollo; el instalador (ADR-0011) generará uno real
      EDP_MASTER_KEY_FILE: /keys/master.key # clave maestra FUERA de la BD y del repo (S6/ADR-0005)
      EDP_WORKSPACES_ROOT: /workspaces
      # la ruta que ve el DAEMON del volumen de workspaces (para los bind de los contenedores de tarea)
      EDP_WORKSPACES_DAEMON_ROOT: /var/lib/docker/volumes/edp-workspaces/_data
      EDP_WORKSPACE_IMAGE: edp-workspace-base
    volumes:
      - edp-keys:/keys
      - edp-workspaces:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock # orquestador de workspaces (residual documentado en modelo-amenazas)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  workspace-base:
    build:
      context: ../apps/workspace-base
    image: edp-workspace-base
    entrypoint: ["true"]
    restart: "no"

  web:
    build:
      context: ../apps/web
    ports:
      - "3101:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  edp-pgdata:
  edp-keys:
  edp-workspaces:
